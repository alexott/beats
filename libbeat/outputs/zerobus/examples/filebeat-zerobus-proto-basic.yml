# Basic Filebeat configuration for Zerobus output with Protocol Buffer format
#
# This example shows the minimal configuration needed to use proto mode.
# For a complete workflow guide, see: ../docs/proto-workflow.md

filebeat.inputs:
  - type: filestream
    id: app-logs
    enabled: true
    paths:
      - /var/log/app/*.log

    processors:
      - add_host_metadata: ~

output.zerobus:
  zerobus_uri: "12345.zerobus.region.cloud.databricks.com"
  workspace_url: "https://workspace.cloud.databricks.com"
  table_name: "catalog.schema.logs"

  oauth:
    client_id: "${OAUTH_CLIENT_ID}"
    client_secret: "${OAUTH_CLIENT_SECRET}"

  # Protocol Buffer configuration
  record_type: "proto"
  proto_descriptor_file: "/etc/filebeat/log_event.descriptor"
  proto_message_type: "logs.LogEvent"  # Can be fully qualified (package.Message) or just MessageName

  workers: 4
  batch_size: 1  # API limitation for JSON mode

  # Optional: Tune SDK behavior
  sdk_options:
    max_inflight_requests: 100000
    recovery: true
    recovery_retries: 5

logging.level: info

# SETUP INSTRUCTIONS:
#
# 1. Create your proto schema (log_event.proto):
#    syntax = "proto3";
#    package logs;
#    message LogEvent {
#      string timestamp = 1;
#      string level = 2;
#      string message = 3;
#      string host = 4;
#      map<string, string> labels = 5;
#    }
#
# 2. Generate descriptor:
#    protoc --descriptor_set_out=log_event.descriptor \
#           --include_imports \
#           log_event.proto
#
# 3. Deploy descriptor:
#    sudo cp log_event.descriptor /etc/filebeat/
#    sudo chmod 644 /etc/filebeat/log_event.descriptor
#
# 4. Ensure your log events match the proto schema structure
#
# 5. Test configuration:
#    filebeat test config -c filebeat.yml
#    filebeat test output -c filebeat.yml
